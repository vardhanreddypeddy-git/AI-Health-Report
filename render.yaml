services:
  - type: web
    name: capstone-health-report-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: capstone-health-report-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: REQUIRE_CLERK_AUTH
        value: "true"
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

databases:
  - name: capstone-health-report-db
    databaseName: health_report
    plan: free
    region: singapore
    postgresMajorVersion: "16"
